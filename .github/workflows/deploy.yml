name: Test & Deploy

on:
  push:
    branches: [feature/cloud-migration, main]   # runs CI (test + lint) only; deploy is gated separately
  pull_request:
    branches: [main]
  # Nightly deploy is fired by an external cron hitting /admin/trigger-deploy,
  # which dispatches this workflow_dispatch trigger — see admin/trigger_deploy.py.
  # GitHub's own `schedule:` trigger has no delivery-time guarantee (observed
  # multi-hour drift), so it isn't used here.
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deploy'
        required: false
        default: 'urgent fix'

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          AUTH_DISABLED: "true"
        run: pytest tests/ -q

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check .

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Run e2e tests
        run: pytest -m e2e tests/e2e -q

  deploy:
    name: Deploy to Fly.io
    needs: [test, lint, e2e]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Skip if no new commits
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST=$(gh run list \
            --repo ${{ github.repository }} \
            --workflow "Test & Deploy" \
            --branch main \
            --status success \
            --limit 10 \
            --json headSha,jobs \
            --jq '[.[] | select(.jobs != null)] | .[0].headSha' 2>/dev/null || echo "none")
          echo "Last deployed SHA: $LAST"
          echo "Current SHA:       ${{ github.sha }}"
          if [ "$LAST" = "${{ github.sha }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "No new commits since last deploy — skipping."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.check.outputs.skip != 'true'

      - name: Deploy
        if: steps.check.outputs.skip != 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only

      - name: Smoke test — health check
        if: steps.check.outputs.skip != 'true'
        run: |
          for i in $(seq 1 12); do
            echo "Attempt $i/12..."
            if curl --silent --fail "${{ secrets.WAYPOINT_URL }}/health"; then
              echo "Health check passed."
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed after 2 minutes."
          exit 1
